name: Check Joker Legion
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun scripts/build-legion-demo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: joker-legion-offline-demo
          path: output/legion-demo.html
